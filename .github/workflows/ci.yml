name: CI

on:
  push:
    branches: ['phase-*', 'recovery-*', 'production-readiness']
  pull_request:
    branches: [main]

concurrency:
  group: cpd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cpd_test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Install locked dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Security release boundary check
        run: npm run security:release
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
      - name: Public login browser smoke
        run: npm run test:e2e:smoke
      - name: Prepare local Supabase compatibility
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/00_supabase_stub.sql
      - name: Apply all database migrations in order
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Run all SQL acceptance suites in version order
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find tests/sql -maxdepth 1 -type f -name 'phase_*.sql' | sort -V); do
            echo "Testing $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

  authenticated-browser-uat:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Install locked dependencies
        run: npm ci
      - name: Start complete local Supabase stack
        run: npx supabase start
      - name: Export ephemeral local Supabase credentials
        shell: bash
        run: |
          set -euo pipefail
          npx supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "E2E_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Seed synthetic users and role contexts
        run: node tests/e2e/seed-local.mjs
      - name: Seed institutional committee fixture
        run: node tests/e2e/seed-committee-local.mjs
      - name: Install Playwright Chromium
        run: npm run test:e2e:install
      - name: Auth and role-context browser UAT
        run: npm run test:e2e:auth
      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
