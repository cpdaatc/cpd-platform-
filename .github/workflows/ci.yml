name: CI

on:
  push:
    branches: ['phase-*', 'recovery-*']
  pull_request:
    branches: [main]

concurrency:
  group: cpd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cpd_test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Prepare local Supabase compatibility
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/00_supabase_stub.sql
      - name: Apply all database migrations in order
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Run all SQL acceptance suites in order
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find tests/sql -maxdepth 1 -type f -name 'phase_*.sql' | sort); do
            echo "Testing $file"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
